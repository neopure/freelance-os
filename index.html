<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Freelance OS">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon-logo-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="app-icon-logo-512.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<title>Freelance OS</title>
<link rel="stylesheet" href="app.css?v=16">
<script src="account.js?v=9"></script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="app-icon-logo-180.png" alt="">Freelance <span>OS</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-watch" id="watch"></div>
  </aside>
  <main>
    <header class="top">
      <h1 id="title">Freelance OS</h1>
      <button type="button" class="month-select" id="month-picker" data-action="pick-dashboard-month" aria-label="Mois affiché" hidden></button>
      <div class="top-actions" id="quick-links">
        <div class="shortcuts" id="shortcuts"></div>
        <button class="btn add" type="button" data-action="new-month" data-demo-lock>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Saisir un mois
        </button>
      </div>
    </header>
    <div class="demo-banner">Mode démo · chiffres fictifs<button class="btn quiet" type="button" data-action="demo-off">Quitter</button></div>
    <section class="view on" id="view"></section>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<script src="core.js?v=6"></script>
<script src="ui.js?v=1"></script>
<script src="agenda.js?v=7"></script>
<script src="app.js?v=11"></script>
<script src="onboarding.js?v=6"></script>
<script src="preview.js?v=7"></script>
</body>
</html>
